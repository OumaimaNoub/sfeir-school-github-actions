name: cache

on:
  workflow_dispatch:

jobs:
  run-npm-install:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: run install
        shell: bash
        run: |
          npm install

      - name: cache node_modules
        uses: actions/cache@v5
        with:
          path: ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

  run-npm-test:
    needs: run-npm-install
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: restore node_modules
        uses: actions/cache@v5
        with:
          path: ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: run test
        shell: bash
        run: |
          npm test
