name: npm test one job
on:
  workflow_dispatch:

jobs:
  run-npm-test:
    runs-on: ubuntu-latest
    steps:
        - name: checkout
          uses: actions/checkout@v7
        - name : setup node
          uses: actions/setup-node@v6
          with:
            node-version: 'lts/*'
        - name: npm install
          shell: bash
          run: npm install

        - name: npm test
          shell: bash
          run: npm test
